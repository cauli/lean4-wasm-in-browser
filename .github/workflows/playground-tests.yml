name: playground tests

# 🤖 The required release gate tests the pinned candidate in Node and Chromium.
# 🤖 Only a successful push-to-main run can trigger automatic production deploy.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-gate:
    uses: ./.github/workflows/runtime-release-gate.yml
