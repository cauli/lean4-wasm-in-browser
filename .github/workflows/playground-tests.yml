name: playground tests

# Integration tests that boot the real Lean WASM compiler headless in Node and
# check it compiles a suite of Lean snippets correctly. They run against the
# DEPLOYED artifacts (fetched from lean.cau.li) — the multi-GB wasm/oleans aren't
# in the repo — so this doubles as a smoke test of the live playground.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *' # daily, catches deploy/artifact regressions

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the tests use only Node built-ins (node:test, node:vm, fetch).
      - name: Fetch deployed Lean artifacts
        run: node tests/fetch-artifacts.mjs
        env:
          LEAN_URL: https://lean.cau.li

      - name: Run compiler integration tests
        run: node --test tests/*.test.mjs
