name: build Manifold Adventure browser layer

# Builds the course modules and standalone browser package from the pinned
# Mathlib manifold closure produced by the Lean fork. The native i386 toolchain
# compiles only the course source here. i386 is intentional: `.olean` files
# embed pointer-sized data, so ordinary x86_64 Mathlib caches cannot be loaded
# by wasm32 Lean.
on:
  workflow_dispatch:
    inputs:
      lean_run_id:
        description: cauli/lean4 CI run containing the exact build-Linux 32bit artifact
        required: true
        default: "29165653896"
      mathlib_layer_run_id:
        description: cauli/lean4 action run containing the matching sphere-and-circle manifold closure
        required: true
      lean_repository:
        description: Lean fork repository
        required: true
        default: cauli/lean4
      lean_commit:
        description: Exact Lean fork commit baked into the WASM/core artifacts
        required: true
        default: 62b6a2291302d4bbeace37642a066b7510d0145c
      mathlib_commit:
        description: Exact compatible Mathlib commit
        required: true
        default: de3a9cf33016bbb6d15880d7680643f7ca2d25ba

permissions:
  contents: read
  actions: read

env:
  PAGES_ASSETS_URL: https://github.com/cauli/lean4-wasm-in-browser/releases/download/pages-assets-manifold-b6428ed/pages-assets-manifold-b6428ed.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout playground
        uses: actions/checkout@v5

      - name: Checkout exact Lean fork source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.lean_repository }}
          ref: ${{ inputs.lean_commit }}
          path: lean4-source
          token: ${{ secrets.LEAN_FORK_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install i386 runtime and build libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libuv1:i386 libssl3t64:i386 \
            gcc-multilib g++-multilib zstd

      - name: Download exact native-i386 Lean toolchain
        env:
          GH_TOKEN: ${{ secrets.LEAN_FORK_TOKEN || github.token }}
        run: |
          gh run download \
            "${{ inputs.lean_run_id }}" \
            -R "${{ inputs.lean_repository }}" \
            -n "build-Linux 32bit" \
            -D lean-artifact
          mkdir lean-toolchain
          tar --use-compress-program=unzstd \
            -xf lean-artifact/*.tar.zst \
            -C lean-toolchain \
            --strip-components=1
          file lean-toolchain/bin/lean
          file lean-toolchain/bin/lean | grep -q 'ELF 32-bit'
          echo "$GITHUB_WORKSPACE/lean-toolchain/bin" >> "$GITHUB_PATH"
          lean-toolchain/bin/lean --githash > lean-githash.txt || true
          grep -qx "${{ inputs.lean_commit }}" lean-githash.txt

      - name: Fetch matching browser base assets
        run: |
          mkdir -p public/lean-wasm
          curl --fail --location --retry 3 "$PAGES_ASSETS_URL" \
            | tar -xz -C public/lean-wasm
          node -e '
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("public/lean-wasm/real-analysis-layer.json"));
          if (manifest.leanCommit !== process.argv[1]) {
            throw new Error(`base layer uses ${manifest.leanCommit}, expected ${process.argv[1]}`);
          }
          if (manifest.mathlibCommit !== process.argv[2]) {
            throw new Error(`base layer uses ${manifest.mathlibCommit}, expected ${process.argv[2]}`);
          }
          ' "${{ inputs.lean_commit }}" "${{ inputs.mathlib_commit }}"

      - name: Download exact browser Mathlib manifold closure
        env:
          GH_TOKEN: ${{ secrets.LEAN_FORK_TOKEN || github.token }}
        run: |
          gh run download \
            "${{ inputs.mathlib_layer_run_id }}" \
            -R "${{ inputs.lean_repository }}" \
            -D browser-mathlib-artifact
          mapfile -t CLOSURE_MANIFESTS < <(find browser-mathlib-artifact -type f -name manifest.json)
          test "${#CLOSURE_MANIFESTS[@]}" -eq 1
          CLOSURE_ROOT=$(dirname "${CLOSURE_MANIFESTS[0]}")
          node -e '
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          if (manifest.kind !== "mathlib-dependency-closure" || manifest.fullMathlib !== false) {
            throw new Error("download is not the manifold dependency closure");
          }
          if (manifest.lean.commit !== process.argv[2]) throw new Error("closure Lean pin changed");
          if (manifest.mathlib.commit !== process.argv[3]) throw new Error("closure Mathlib pin changed");
          if (String(manifest.lean.toolchainRunId) !== process.argv[4]) {
            throw new Error("closure was built from a different toolchain run");
          }
          for (const root of [
            "Mathlib.Geometry.Manifold.IsManifold.Basic",
            "Mathlib.Geometry.Manifold.Instances.Sphere",
            "Mathlib.Analysis.SpecialFunctions.Complex.Circle",
          ]) {
            if (!manifest.mathlib.roots.includes(root)) {
              throw new Error(`closure does not contain ${root}`);
            }
          }
          ' \
            "$CLOSURE_ROOT/manifest.json" \
            "${{ inputs.lean_commit }}" \
            "${{ inputs.mathlib_commit }}" \
            "${{ inputs.lean_run_id }}"
          echo "CLOSURE_ROOT=$CLOSURE_ROOT" >> "$GITHUB_ENV"

      - name: Checkout pinned Mathlib and dependency sources
        run: |
          MATHLIB_REPOSITORY=$(jq -r '.mathlib.repository' "$CLOSURE_ROOT/manifest.json")
          git init mathlib4
          git -C mathlib4 remote add origin "$MATHLIB_REPOSITORY"
          git -C mathlib4 fetch --depth=1 origin "${{ inputs.mathlib_commit }}"
          git -C mathlib4 checkout --detach FETCH_HEAD
          test "$(git -C mathlib4 rev-parse HEAD)" = "${{ inputs.mathlib_commit }}"

          mkdir -p mathlib4/.lake/packages
          while IFS=$'\t' read -r NAME URL REV
          do
            TARGET="mathlib4/.lake/packages/$NAME"
            git init "$TARGET"
            git -C "$TARGET" remote add origin "$URL"
            git -C "$TARGET" fetch --depth=1 origin "$REV"
            git -C "$TARGET" checkout --detach FETCH_HEAD
            test "$(git -C "$TARGET" rev-parse HEAD)" = "$REV"
          done < <(jq -r '.mathlib.packages[] | [.name, .url, .rev] | @tsv' "$CLOSURE_ROOT/manifest.json")

      - name: Unpack the checksum-verified browser closure
        run: |
          node scripts/unpack-browser-library-closure.mjs \
            "$CLOSURE_ROOT" \
            "$PWD/mathlib4/.lake/build/lib/lean" \
            "${{ inputs.lean_commit }}" \
            "${{ inputs.mathlib_commit }}"

      - name: Regenerate and compile the course world modules
        run: |
          node scripts/create-manifold-game.mjs
          git diff --exit-code -- \
            lean/ManifoldAdventure \
            src/game/manifolds.generated.json \
            src/game/manifolds-verifier.generated.json
          bash scripts/build-manifold-course.sh "$PWD/mathlib4"
          MATHLIB_ROOT="$PWD/mathlib4" node scripts/verify-manifold-references.mjs

      - name: Package incremental Manifold Adventure world layers
        run: |
          bash scripts/package-manifold-layers.sh \
            "$PWD/mathlib4" \
            "$PWD/lean4-source/src"

      - name: Validate package pins and contents
        run: |
          node -e '
          const fs = require("fs");
          const index = JSON.parse(fs.readFileSync("public/lean-wasm/manifold-layer.json"));
          const source = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const course = JSON.parse(fs.readFileSync("src/game/manifolds.generated.json", "utf8"));
          const c = JSON.parse(fs.readFileSync("src/game/manifolds.conformance.json"));
          if (index.kind !== "manifold-course-layer-index") throw new Error("layer index is invalid");
          if (index.leanCommit !== process.argv[1]) throw new Error("Lean pin changed");
          if (index.mathlibCommit !== process.argv[2]) throw new Error("Mathlib pin changed");
          if (c.validation?.compilerCommit !== process.argv[1]) {
            throw new Error("reference matrix did not use the exact Lean fork compiler");
          }
          if (index.layers.length !== 9) throw new Error("expected nine world layers");
          if (c.sourceCommit !== course.source.commit) {
            throw new Error("reference matrix belongs to a different course revision");
          }
          if (c.summary?.total !== 40 || c.verifiedReferenceSolutions?.length !== 40) {
            throw new Error("reference matrix does not cover all 40 levels");
          }
          const seen = new Set();
          for (const layer of index.layers) {
            const m = JSON.parse(fs.readFileSync(`public/lean-wasm/${layer.manifestFile}`));
            if (m.leanCommit !== process.argv[1] || m.mathlibCommit !== process.argv[2]) {
              throw new Error(`${layer.world} pins changed`);
            }
            if (!m.files.includes(`ManifoldAdventure/${layer.world}.olean`)) {
              throw new Error(`course ${layer.world}.olean is missing`);
            }
            for (const file of m.files) {
              if (seen.has(file)) throw new Error(`${file} is duplicated across world layers`);
              seen.add(file);
            }
          }
          const first = JSON.parse(fs.readFileSync(
            `public/lean-wasm/${index.layers[0].manifestFile}`,
          ));
          if (first.files.includes("Mathlib/Geometry/Manifold/IsManifold/Basic.olean")) {
            throw new Error("the first world still packages the smooth-manifold closure");
          }
          if (!first.files.includes("Init.olean") || !first.files.some((file) => file.startsWith("Init/"))) {
            throw new Error("the first world is missing Init files required by module resolution");
          }
          if (first.compressedBytes >= 240 * 1024 * 1024) {
            throw new Error("the first world does not materially reduce the current cold transfer");
          }
          index.browserMathlibClosure = {
            repository: process.argv[4],
            actionRunId: process.argv[5],
            workflowCommit: source.lean.workflowCommit,
            toolchainRunId: source.lean.toolchainRunId,
            layerId: source.layerId,
            roots: source.mathlib.roots,
          };
          fs.writeFileSync(
            "public/lean-wasm/manifold-layer.json",
            `${JSON.stringify(index, null, 2)}\n`,
          );
          console.log(
            `${index.layers.length} incremental layers, ` +
            `${index.totals.packs} packs in the complete course`,
          );
          ' \
            "${{ inputs.lean_commit }}" \
            "${{ inputs.mathlib_commit }}" \
            "$CLOSURE_ROOT/manifest.json" \
            "${{ inputs.lean_repository }}" \
            "${{ inputs.mathlib_layer_run_id }}"

      - name: Stage artifact
        run: |
          mkdir manifold-browser-layer
          cp public/lean-wasm/manifold-layer.json manifold-browser-layer/
          cp public/lean-wasm/manifold-*-layer.json manifold-browser-layer/
          cp -R public/lean-wasm/manifold-*-lib manifold-browser-layer/
          cp src/game/manifolds.conformance.json manifold-browser-layer/
          cp "$CLOSURE_ROOT/manifest.json" manifold-browser-layer/source-closure-manifest.json
          cp "$CLOSURE_ROOT/SHA256SUMS" manifold-browser-layer/source-closure-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: manifold-layer-${{ inputs.lean_commit }}
          path: manifold-browser-layer
          retention-days: 30
