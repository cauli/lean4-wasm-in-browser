name: deploy pages

# 🤖 Production accepts only successful push-to-main release gates. Manual runs
# 🤖 validate the selected commit and publish only to an explicit preview branch.
on:
  workflow_run:
    workflows: [playground tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview_branch:
        description: Preview branch name (must start preview-; never main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.event_name == 'workflow_dispatch' && inputs.preview_branch || 'production' }}
  cancel-in-progress: true

jobs:
  preview-input:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview destination
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: node deploy/deploy-target.mjs preview "$PREVIEW_BRANCH"
  preview-gate:
    needs: preview-input
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/runtime-release-gate.yml
  deploy:
    needs: [preview-input, preview-gate]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && needs.preview-gate.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'preview' || 'production' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 🤖 Build the tested commit, never a newer moving branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch static Lean assets
        run: node deploy/static-assets.mjs fetch
      - name: Build Pages output with the pinned release
        run: bash deploy/build-pages.sh
      - name: Select the deployment destination
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: node deploy/deploy-target.mjs event >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare Pages
        run: >-
          npx wrangler@4 pages deploy dist
          --project-name lean-playground
          --branch "$PAGES_DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
